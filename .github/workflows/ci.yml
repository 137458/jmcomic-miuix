name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 单元测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 仓库的 compileSdk 是 android-37.0，运行器预装 SDK 未必包含该平台，
      # 显式补装平台与对应 build-tools，避免依赖镜像里的既有版本。
      - name: 补装 Android SDK 平台与构建工具
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --console=plain

      - name: 构建 Debug 包
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore
